name: CI Verification & Invariants Guard

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: Fast Verification & Test-Locking Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Test-Locking Integrity Guard
        run: node scripts/test-locking-guard.mjs

      - name: Run Fast Verification Pipeline
        run: node scripts/verify-fast.mjs
